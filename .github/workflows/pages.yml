---
name: Deploy site
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # site/index.html is a body fragment (it is also published as a Claude
      # artifact, which adds its own document shell), so wrap it here.
      - name: Wrap page
        run: |
          mkdir -p _site
          {
            echo '<!doctype html><html lang="en"><head>'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '</head><body>'
            cat site/index.html
            echo '</body></html>'
          } > _site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
